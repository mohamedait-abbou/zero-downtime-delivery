services:
  api:
    build: ./apps/api
    image: dockyard-api:dev
    environment:
      APP_VERSION: dev
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    build: ./apps/worker
    image: dockyard-worker:dev
    environment:
      API_URL: http://api:8000
      INTERVAL_S: "5"
    depends_on:
      api:
        condition: service_healthy
